# ── Server ──
server.port=4000

# ── MySQL connection ──
# 1. Create the database first:  CREATE DATABASE saloon_db;
# 2. Update username/password below to match your local MySQL setup.
spring.datasource.url=jdbc:mysql://localhost:3306/rajkumar_salon?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──
# 'update' auto-creates/updates the songs table from the Song entity on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Seed data.sql only once (comment out after first run to avoid duplicate rows) ──
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ── Multipart file upload (for audio BLOB upload) ──
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
